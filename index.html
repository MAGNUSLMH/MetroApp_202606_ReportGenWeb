<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件總結生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./ReportGen_icon.png" type="image/png">
  <!-- https://www.flaticon.com/free-icon/review_710935 -->
</head>
<body>
  <header class="app-header">
    <h1>事件總結生成器</h1>
    <button id="reset-btn" class="reset-btn" type="button" aria-label="清除並重設為預設狀態">🗑️</button>
  </header>
  <main class="app-main">
    <section class="note-container">
      <div class="top-fields">
        <div class="field-row">
          <label for="fault-description" class="emphasis-label">Fault Description</label>
          <textarea id="fault-description" class="top-textarea" rows="2"></textarea>
        </div>
        <div class="field-row">
          <span class="emphasis-label">Sequency of event</span>
        </div>
        <div class="field-row">
          <label class="field-label" for="start-date-year">開始日期</label>
          <div class="date-select-group">
            <select id="start-date-year" class="date-select"></select>
            <span class="date-separator">年</span>
            <select id="start-date-month" class="date-select"></select>
            <span class="date-separator">月</span>
            <select id="start-date-day" class="date-select"></select>
            <span class="date-separator">日</span>
          </div>
          <div id="start-date-error" class="field-error hidden"></div>
        </div>
      </div>

      <div class="note-header">
        <div class="col-label move-col-label">移動</div>
        <div class="col-label time-col-label">時間</div>
        <div class="col-label desc-col-label">描述</div>
      </div>
      <div id="rows-container" class="rows-container"></div>
      <div class="actions-row">
        <button id="add-row-btn" class="primary-btn" type="button">新增一行</button>
        <button id="export-btn" class="secondary-btn" type="button">匯出文字檔</button>
      </div>
      <br>
      <div class="bottom-fields">
        <div class="field-row">
          <label for="finding" class="emphasis-label">Finding</label>
          <textarea id="finding" class="bottom-textarea" rows="2"></textarea>
        </div>
        <div class="field-row">
          <label for="root-cause" class="emphasis-label">Root Cause</label>
          <textarea id="root-cause" class="bottom-textarea" rows="2"></textarea>
        </div>
        <div class="field-row">
          <label for="action-taken" class="emphasis-label">Action Taken</label>
          <textarea id="action-taken" class="bottom-textarea" rows="2"></textarea>
        </div>
        <div class="field-row">
          <label for="resume-time" class="emphasis-label">Resume time</label>
          <textarea id="resume-time" class="bottom-textarea" rows="2"></textarea>
        </div>
      </div>
      <div class="excel-row">
        <button id="excel-btn" class="excel-btn" type="button">生成Excel</button>
      </div>
      <textarea id="sequence" hidden></textarea>
    </section>
  </main>

  <template id="row-template">
    <div class="note-row">
      <div class="move-cell">
        <button type="button" class="move-row-btn" aria-label="設定此列（移動或刪除）">⚙</button>
      </div>
      <div class="time-cell">
        <input type="text" class="time-input" placeholder="點擊設定" readonly>
        <div class="time-popup hidden">
          <div class="time-format-toggle">
            <label><input type="radio" value="24" checked>24小時制</label>
            <label><input type="radio" value="12">12小時制</label>
          </div>
          <div class="time-fields">
            <input type="number" class="hour-input" min="0" max="23" inputmode="numeric"> :
            <input type="number" class="minute-input" min="0" max="59" inputmode="numeric">
            <select class="ampm-select">
              <option value="AM">上午</option>
              <option value="PM">下午</option>
            </select>
          </div>
          <div class="time-popup-actions">
            <button type="button" class="time-ok-btn">確定</button>
            <button type="button" class="time-cancel-btn">取消</button>
          </div>
          <div class="time-error hidden"></div>
        </div>
      </div>
      <div class="desc-cell">
        <textarea class="desc-input" rows="2" placeholder="輸入描述..."></textarea>
      </div>
    </div>
  </template>

  <!-- ExcelJS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <!-- Excel helper that exposes window.downloadExcel -->
  <script src="exceljs_gen.js"></script>
  <!-- Main page logic -->
  <script src="script.js"></script>
</body>
</html>

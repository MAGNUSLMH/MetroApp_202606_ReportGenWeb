<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件報表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./ReportGen_icon.png" type="image/png">
  <!-- https://www.flaticon.com/free-icon/review_710935 -->
</head>
<body>
  <header class="app-header">
      <div class="header-left">
        <div class="hkt-time-label">TIME HKT</div>
        <div id="hkt-clock" class="hkt-clock">--:--:--</div>
      </div>
    <h1>事件報表</h1>
    <button id="reset-btn" class="reset-btn" type="button" aria-label="清除並重設為預設狀態">🗑️</button>
  </header>
    <!-- Page title bar -->
  <div id="page-title-bar" class="page-title-bar">
    <span id="page-title-text">事件報表</span>
  </div>

  <!-- Fixed undo/redo toolbar for report content -->
    <div class="history-toolbar">
    <button id="undo-btn" class="history-btn" type="button" aria-label="復原最近變更" disabled>
      ↩ Undo
    </button>
    <button id="redo-btn" class="history-btn" type="button" aria-label="重做最近復原" disabled>
      ↪ Redo
    </button>
  </div>


  <main id="report-main" class="app-main">

    <section class="note-container">
      <div class="top-fields">
        <div class="field-row">
          <div class="field-label-row">
            <label for="fault-description" class="emphasis-label">Fault Description</label>
            <div class="field-label-actions">
              <button
                type="button"
                class="google-translate-btn"
                data-translate-target="fault-description"
              >轉英文</button>
              <button
                type="button"
                class="copy-inline-btn"
                data-copy-target="fault-description"
              >Copy</button>
            </div>
          </div>
          <textarea id="fault-description" class="top-textarea" rows="2"></textarea>
        </div>
        <div class="field-row">
          <div class="field-label-row">
            <span class="emphasis-label">Sequency of event</span>
          </div>
        </div>
        <div class="field-row">
          <label class="field-label" for="start-date-year">開始日期</label>
          <div class="date-select-group">
            <select id="start-date-year" class="date-select"></select>
            <span class="date-separator">年</span>
            <select id="start-date-month" class="date-select"></select>
            <span class="date-separator">月</span>
            <select id="start-date-day" class="date-select"></select>
            <span class="date-separator">日</span>
          </div>
          <div id="start-date-error" class="field-error hidden"></div>
        </div>
        <div class="field-row">
          <span class="field-label">事件</span>
        </div>
      </div>

      <div class="note-header">
        <div class="col-label move-col-label"></div>
        <div class="col-label time-col-label">時間</div>
        <div class="col-label desc-col-label">描述</div>
      </div>
      <div id="rows-container" class="rows-container"></div>
      <div class="memo-section">
        <div class="field-row">
          <div class="field-label-row">
            <label for="memo-mode" class="field-label">備注</label>
            <div class="field-label-actions">
              <button
                type="button"
                class="memo-translate-btn go-translate-btn"
                data-source="memo"
              >轉英文</button>
              <button
                type="button"
                class="copy-inline-btn"
                data-copy-target="memo-text"
              >Copy</button>
            </div>
          </div>
        </div>
        <div class="field-row">
          <select id="memo-mode" class="memo-select">
            <option value="TBC">TBC</option>
            <option value="NO_DELAY">No train delay</option>
            <option value="DELAY">Train delay XX mins</option>
            <option value="NO_INJURY">No passenger injury</option>
            <option value="NONE">無字</option>
            <option value="FREE">手動輸入文字...</option>
          </select>
        </div>
        <div class="field-row memo-text-row smartfill-target-hit-area" data-smartfill-target="memo-text">
          <textarea
            id="memo-text"
            class="bottom-textarea"
            rows="2"
            placeholder="輸入..."
          ></textarea>
          <div id="memo-delay-wrapper" class="memo-delay-wrapper hidden">
            <span class="memo-delay-label">Train delay</span>
            <div class="memo-delay-input-row">
              <input
                id="memo-delay-mins"
                class="memo-delay-input"
                type="number"
                min="0"
                max="999"
                inputmode="numeric"
              />
              <span class="memo-delay-suffix">mins</span>
            </div>
          </div>
        </div>
      </div>
       <div class="memo-section">
        <button id="export-btn" class="secondary-btn" type="button">匯出文字檔</button>
        <button id="whatsapp-btn" class="secondary-btn whatsapp-btn" type="button">
          <img src="whatsapp_icon.png" alt="WhatsApp" class="whatsapp-icon" width="30" height="30"> WhatsApp
        </button>
      </div>
      <br>
      <div class="bottom-fields">
         <div class="field-row smartfill-target-hit-area" data-smartfill-target="finding">
           <div class="field-label-row">
             <label for="finding" class="emphasis-label">Finding (發現)</label>
             <div class="field-label-actions">
               <button
                 type="button"
                 class="google-translate-btn"
                 data-translate-target="finding"
               >轉英文</button>
               <button
                 type="button"
                 class="copy-inline-btn"
                 data-copy-target="finding"
               >Copy</button>
             </div>
           </div>
          <select id="finding-mode" class="memo-select">
            <option value="FREE">手動輸入文字</option>
            <option value="TBC">TBC</option>
          </select>
          <textarea
            id="finding"
            class="bottom-textarea"
            rows="2"
            placeholder="輸入..."
          ></textarea>
        </div>
         <div class="field-row smartfill-target-hit-area" data-smartfill-target="root-cause">
           <div class="field-label-row">
             <label for="root-cause" class="emphasis-label">Root Cause (原因)</label>
             <div class="field-label-actions">
               <button
                 type="button"
                 class="google-translate-btn"
                 data-translate-target="root-cause"
               >轉英文</button>
               <button
                 type="button"
                 class="copy-inline-btn"
                 data-copy-target="root-cause"
               >Copy</button>
             </div>
           </div>
          <select id="root-cause-mode" class="memo-select">
            <option value="FREE">手動輸入文字</option>
            <option value="TBC">TBC</option>
          </select>
          <textarea
            id="root-cause"
            class="bottom-textarea"
            rows="2"
            placeholder="輸入..."
          ></textarea>
        </div>
         <div class="field-row smartfill-target-hit-area" data-smartfill-target="action-taken">
           <div class="field-label-row">
             <label for="action-taken" class="emphasis-label">Action Taken</label>
             <div class="field-label-actions">
               <button
                 type="button"
                 class="google-translate-btn"
                 data-translate-target="action-taken"
               >轉英文</button>
               <button
                 type="button"
                 class="copy-inline-btn"
                 data-copy-target="action-taken"
               >Copy</button>
             </div>
           </div>
          <select id="action-taken-mode" class="memo-select">
            <option value="FREE">手動輸入文字</option>
            <option value="TBC">TBC</option>
          </select>
          <textarea
            id="action-taken"
            class="bottom-textarea"
            rows="2"
            placeholder="輸入..."
          ></textarea>
        </div>
         <div class="field-row smartfill-target-hit-area" data-smartfill-target="resume-time">
           <div class="field-label-row">
             <label for="resume-time" class="emphasis-label">Resume time</label>
             <div class="field-label-actions">
               <button
                 type="button"
                 class="google-translate-btn"
                 data-translate-target="resume-time"
               >轉英文</button>
               <button
                 type="button"
                 class="copy-inline-btn"
                 data-copy-target="resume-time"
               >Copy</button>
             </div>
           </div>
          <select id="resume-time-mode" class="memo-select">
            <option value="TBC">TBC</option>
            <option value="RESOLVED">回復時間</option>
            <option value="FREE">手動輸入文字</option>
          </select>
          <textarea
            id="resume-time"
            class="bottom-textarea"
            rows="2"
            placeholder="輸入..."
          ></textarea>
        </div>
      </div>
      <div class="excel-row">
        <button id="excel-btn" class="excel-btn" type="button">生成Excel</button>
        <button
          id="whatsapp-summary-btn"
          class="secondary-btn whatsapp-btn"
          type="button"
        >
          <img
            src="whatsapp_icon.png"
            alt="WhatsApp"
            class="whatsapp-icon"
            width="30"
            height="30"
          >
          WhatsApp
        </button>
      </div>
      <textarea id="sequence" hidden></textarea>
    </section>
  </main>

    <main id="translate-main" class="app-main hidden">
    <section class="note-container translate-container">
      <h3 class="subheading">原本中文文字</h3>
      <div class="field-row">
        <textarea
          id="english-original"
          class="bottom-textarea english-textarea"
          rows="2"
        ></textarea>
      </div>

      <div class="field-row translate-button-row">
        <button type="button" id="english-translate-btn" class="translate-btn">翻譯</button>
      </div>
        <div
          id="translate-overlay"
          class="translate-overlay hidden"
          aria-live="polite"
        >
          <div class="translate-overlay-content">
            <div class="translate-overlay-text">翻譯中</div>
            <div class="translate-overlay-dots">
              <span class="translate-overlay-dot"></span>
              <span class="translate-overlay-dot"></span>
              <span class="translate-overlay-dot"></span>
            </div>
          </div>
        </div>
        <div
          id="translate-cards-wrapper"
          class="translate-cards-wrapper hidden"
          aria-live="polite"
        >
          <div class="translate-cards-row">
            <!-- 第一個翻譯 : GPT-5.1 (MTR語言) UI 已被隱藏 -->
            <article class="translate-card translate-card-first" hidden aria-hidden="true">
              <h3 class="subheading translate-option-header translate-option-header-1">
                第一個翻譯 : GPT-5.1 (MTR語言)
              </h3>
              <div class="translate-card-row">
                <button
                  type="button"
                  id="first-translate-adopt-btn"
                  class="translate-card-btn translate-card-btn-adopt"
                  aria-label="採用第一個英文翻譯結果"
                >
                  ✅
                </button>
                <textarea
                  id="english-google"
                  class="bottom-textarea english-textarea translate-option-textarea-1"
                  rows="2"
                  readonly
                ></textarea>
              </div>
              <div class="translate-card-row">
                <button
                  type="button"
                  id="first-translate-back-btn"
                  class="translate-card-btn translate-card-btn-back"
                  aria-label="將第一個翻譯的中文內容移回原本中文文字欄位"
                >
                  ⬆️
                </button>
                <textarea
                  id="first-translate-chinese"
                  class="bottom-textarea double-translate-textarea"
                  rows="2"
                ></textarea>
              </div>
            </article>

            <article class="translate-card translate-card-second">
              <h3 class="subheading translate-option-header translate-option-header-2">
                Google Translate
              </h3>
              <div class="translate-card-row">
                <button
                  type="button"
                  id="second-translate-adopt-btn"
                  class="translate-card-btn translate-card-btn-adopt"
                  aria-label="採用翻譯結果"
                >
                  ✅
                </button>
                <textarea
                  id="english-edited"
                  class="bottom-textarea english-textarea translate-option-textarea-2"
                  rows="2"
                ></textarea>
              </div>
              <div class="translate-card-row">
                <button
                  type="button"
                  id="second-translate-back-btn"
                  class="translate-card-btn translate-card-btn-back"
                  aria-label="將翻譯的中文內容移回原本中文文字欄位"
                >
                  ⬆️
                </button>
                <textarea
                  id="second-translate-chinese"
                  class="bottom-textarea double-translate-textarea"
                  rows="2"
                ></textarea>
              </div>
            </article>
          </div>
        </div>

      <div class="field-row">
        <div
          id="translate-target-indicator"
          class="translate-target-indicator"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

    <main id="smartfill-main" class="app-main hidden">
      <section class="note-container smartfill-container">
        <header class="smartfill-header">
          <div class="smartfill-title-block">
            <h2 class="subheading">快速輸入</h2>
            <p class="smartfill-subtext">從歷史事件中快速搜尋與複製英文句子。</p>
          </div>
                    <div class="smartfill-toolbar">
            <div class="smartfill-search-wrapper">
              <span class="smartfill-search-icon" aria-hidden="true">🔍</span>
                          <input
                id="smartfill-search"
                type="search"
                class="smartfill-search-input"
                placeholder="搜尋關鍵字（如 PSD 226、false alarm、LHS LLS...）"
                autocomplete="off"
              >

            </div>
            <button
              type="button"
              id="smartfill-sort"
              class="smartfill-sort-btn"
            >
              🅰️🅱️ 變更為以A-Z排序
            </button>
            <button
              type="button"
              id="smartfill-toggle-all"
              class="smartfill-toggle-all-btn"
            >
              展開全部
            </button>
          </div>

        </header>

        <div id="smartfill-dashboard" class="smartfill-dashboard" aria-live="polite">
          <!-- smartfill_script.js will render grouped sections and accordions here -->
        </div>
      </section>
    </main>

    <!-- Smartfill apply overlay (灰色遮罩，用於從 Smartfill 套用文字到報表頁) -->
    <div
      id="smartfill-apply-overlay"
      class="smartfill-apply-overlay hidden"
      aria-hidden="true"
    ></div>

    <footer class="app-footer">

    <button type="button" class="footer-tab footer-tab-active" data-tab="report">
      <span class="footer-emoji" aria-hidden="true">📋</span>
      <span class="footer-label">事件報表</span>
    </button>
    <button type="button" class="footer-tab" data-tab="translate">
      <span class="footer-emoji" aria-hidden="true">✏️</span>
      <span class="footer-label">英文翻譯</span>
    </button>
    <button type="button" class="footer-tab" data-tab="smartfill">
      <span class="footer-emoji" aria-hidden="true">💡</span>
      <span class="footer-label">快速輸入</span>
    </button>
  </footer>

  <template id="row-template">
    <div class="note-row">
       <div class="move-cell">
         <button type="button" class="move-row-btn" aria-label="設定此列（移動或刪除）">⚙️</button>
         <div class="row-actions-popup hidden">
           <button type="button" class="row-action-btn row-action-up">向上</button>
           <button type="button" class="row-action-btn row-action-down">向下</button>
           <button type="button" class="row-action-btn row-action-add-below">向下加行</button>
           <button type="button" class="row-action-btn row-action-delete">刪除</button>
           <button type="button" class="row-action-btn row-action-go-translate go-translate-btn" data-source="row-desc">轉英文</button>
           <button type="button" class="row-action-btn row-action-copy">Copy</button>
           <button type="button" class="row-action-btn row-action-cancel">取消</button>
         </div>
       </div>
      <div class="time-cell">
        <input type="text" class="time-input" placeholder="時間..." readonly>
        <div class="time-popup hidden">
          <div class="time-fields">
            <input type="number" class="hour-input" min="0" max="23" inputmode="numeric"> :
            <input type="number" class="minute-input" min="0" max="59" inputmode="numeric">
          </div>
          <div class="time-popup-actions">
            <button type="button" class="time-ok-btn">確定</button>
            <button type="button" class="time-cancel-btn">取消</button>
          </div>
          <div class="time-error hidden"></div>
        </div>
      </div>
      <div class="desc-cell">
        <textarea class="desc-input" rows="2" placeholder="輸入描述..."></textarea>
      </div>
    </div>
  </template>

    <!-- ExcelJS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <!-- Excel helper that exposes window.downloadExcel -->
  <script src="exceljs_gen.js"></script>
  <!-- Main page logic split into general, report, translator and smartfill scripts -->
  <script src="general_script.js"></script>
  <script src="report_script.js"></script>
  <script src="translator_script.js"></script>
  <script src="smartfill_script.js"></script>
</body>
</html>
